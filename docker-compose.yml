x-machine-learning-environment: &machine-learning-environment
    MI_HOST: ${MI_HOST:-0.0.0.0}
    MI_PORT: ${MI_PORT:-5005}
    MI_GRAYLOG_HOST: ${MI_GRAYLOG_HOST:-}
    MI_GRAYLOG_PORT: ${MI_GRAYLOG_PORT:-}
    MI_BROKER_URL: ${MI_BROKER_URL:?Set MI_BROKER_URL in .env}
    MI_RESULT_BACKEND: ${MI_RESULT_BACKEND:?Set MI_RESULT_BACKEND in .env}
    MI_DATABASE_URL: ${MI_DATABASE_URL:?Set MI_DATABASE_URL in .env}
    MI_CORS_ALLOWED_ORIGINS: ${MI_CORS_ALLOWED_ORIGINS:-}

networks:
    bridge:
        driver: bridge

volumes:
    mongo_db:
        name: mongo_db
        driver: local
        driver_opts:
            device: 'D:\Docker\data\db'
            o: 'bind'
            type: 'none'
    mongo_configdb:
        name: mongo_configdb
        driver: local
        driver_opts:
            device: 'D:\Docker\data\configdb'
            o: 'bind'
            type: 'none'
    elasticsearch_data:
        name: elasticsearch_data
        driver: local
        driver_opts:
            device: 'D:\Docker\elasticsearch\data'
            o: 'bind'
            type: 'none'
    graylog_journal:
        name: graylog_journal
        driver: local
        driver_opts:
            device: 'D:\Docker\graylog\journal'
            o: 'bind'
            type: 'none'
    graylog_config:
        name: graylog_config
        driver: local
        driver_opts:
            device: 'D:\Docker\graylog\config'
            o: 'bind'
            type: 'none'
    exchange_service_logs:
        name: exchange_service_logs
        driver: local
        driver_opts:
            device: 'D:\Docker\exchange\service\logs'
            o: 'bind'
            type: 'none'
    exchange_service_config:
        name: exchange_service_config
        driver: local
        driver_opts:
            device: 'D:\Docker\exchange\service\config'
            o: 'bind'
            type: 'none'
    exchange_service_indicators:
        name: exchange_service_indicators
        driver: local
        driver_opts:
            device: 'D:\Docker\exchange\service\indicators'
            o: 'bind'
            type: 'none'

services:
    nginx.reverse.proxy: 
        image: nginx:1.30.4-alpine3.24-slim
        container_name: nginx.reverse.proxy
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "${GATEWAY_PORT:-80}:80"
        depends_on:
            backend:
                condition: service_healthy
            frontend:
                condition: service_healthy
            machinelearning:
                condition: service_healthy
        networks:
            bridge:

    # mongo Database
    mongodb:
        image: mongo:${MONGO_DB_VERSION}
        restart: always
        container_name: mongodb
        hostname: mongodb
        # List directories to mount
        volumes:
            - mongo_db:/data/db:rw
            - mongo_configdb:/data/configdb:rw
            - ./docker/mongodb/init.sh:/init.sh:rw
            - ./docker/mongodb/mongo-users-init.js:/docker-entrypoint-initdb.d/mongo-users-init.js:rw
        command: [
            "./init.sh"
        ]
        ports:
            - 27017:27017
            - 27018:27018
            - 27019:27019
        networks:
            bridge:
      
    # Elasticsearch: https://www.elastic.co/guide/en/elasticsearch/reference/6.6/docker.html
    elasticsearch:
        container_name: elasticsearch
        hostname: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.6.1
        #data folder in share for persistence
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        environment:
            - http.host=0.0.0.0
            - transport.host=localhost
            - network.host=0.0.0.0
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        mem_limit: 1g
        ports:
            - 9200:9200
            - 9300:9300
        networks:
            bridge:
      
    # Graylog: https://hub.docker.com/r/graylog/graylog/
    graylog:
        container_name: graylog
        hostname: graylog
        restart: always
        image: graylog/graylog:3.3.8-1
        #journal and config directories in local NFS share for persistence
        volumes:
            - graylog_journal:/usr/share/graylog/data/journal
            - graylog_config:/usr/share/graylog/data/config
        environment:
            - GRAYLOG_HTTP_BIND_ADDRESS=${GRAYLOG_HTTP_BIND_ADDRESS}
            # CHANGE ME (must be at least 16 characters)!
            - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
            # Password: admin
            - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
            - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
            - GRAYLOG_MONGODB_URI=${GRAYLOG_MONGODB_URI}
            - GRAYLOG_ELASTICSEARCH_HOSTS=${GRAYLOG_ELASTICSEARCH_HOSTS}
            - GRAYLOG_ROOT_TIMEZONE=${GRAYLOG_ROOT_TIMEZONE}
        ports:
            # Graylog web interface and REST API
            - 7555:7555
            # Syslog TCP
            - 8514:8514
            # Syslog UDP
            - 8514:8514/udp
            # GELF TCP
            - 12201:12201
            # GELF UDP
            - 12201:12201/udp
        networks:
            bridge:

    #main exchange service
    backend:   
        container_name: backend
        hostname: backend
        image: exchange-core-backend:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./docker/exchange.service/Dockerfile
        volumes:
            - exchange_service_logs:/exchange/service/logs:rw
            - exchange_service_indicators:/exchange/service/indicators:z
            - exchange_service_config:/exchange/service/config:rw
        ports:
            - 5000:5000
        environment:
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Docker}
        read_only: true
        tmpfs:
            - /tmp
        networks:
            bridge:

    # Machine-learning Celery worker
    celery:
        container_name: celery
        hostname: celery
        image: exchange-core-machine-learning:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment: *machine-learning-environment
        build:
            context: .
            dockerfile: ./docker/service.machine.learning/Dockerfile
        command: ["celery", "-A", "app.tasks.task_work:celery", "worker", "--loglevel=INFO", "--pool=prefork"]
        volumes:
            - exchange_service_indicators:/usr/src/app/static:rw
        read_only: true
        tmpfs:
            - /tmp
        depends_on:
            - mongodb
        healthcheck:
            # Mongo transport delivers tasks and results but its remote-control
            # broadcast does not reliably answer `celery inspect ping`.
            test: ["CMD", "python", "healthcheck_worker.py"]
            interval: 30s
            timeout: 10s
            start_period: 30s
            retries: 3
        networks:
            bridge:

    # Accepted Angular 22 browser frontend.
    frontend:
        container_name: frontend
        hostname: frontend
        image: exchange-core-frontend:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        build:
            context: ./exchange.signalR.client.web.frontend.angular
            dockerfile: Dockerfile
        ports:
            - "${FRONTEND_PORT:-9000}:8080"
        environment:
            EXCHANGE_HUB_URL: ${FRONTEND_HUB_URL:-/backend/hubs/exchange}
            ML_API_URL: ${FRONTEND_ML_API_URL:-/machinelearning/api/v1/}
        read_only: true
        tmpfs:
            - /tmp
        depends_on:
            backend:
                condition: service_healthy
            machinelearning:
                condition: service_healthy
        networks:
            bridge:

    # Machine-learning web application
    machinelearning:
        container_name: machinelearning
        hostname: machinelearning
        image: exchange-core-machine-learning:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./docker/service.machine.learning/Dockerfile
        ports:
            - 5005:5005
        volumes:
            - exchange_service_indicators:/usr/src/app/static:rw
        read_only: true
        tmpfs:
            - /tmp
        env_file:
            - path: .env
              required: false
        environment: *machine-learning-environment
        depends_on:
            - mongodb
        networks:
            bridge:
