server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /runtime-config.json {
    alias /tmp/runtime-config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
