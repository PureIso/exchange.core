name: exchange-core-acceptance

x-machine-learning-environment: &machine-learning-environment
    MI_HOST: 0.0.0.0
    MI_PORT: 5005
    MI_GRAYLOG_HOST: ""
    MI_GRAYLOG_PORT: ""
    MI_BROKER_URL: mongodb://mongodb:27017/celery
    MI_RESULT_BACKEND: mongodb://mongodb:27017/celery
    MI_DATABASE_URL: mongodb://mongodb:27017/machinelearning

networks:
    acceptance:
        driver: bridge

volumes:
    mongo_data:
    mongo_config:
    backend_logs:
    backend_indicators:
    ml_artifacts:

services:
    mongodb:
        image: mongo:${MONGO_DB_VERSION:-8}
        restart: unless-stopped
        volumes:
            - mongo_data:/data/db
            - mongo_config:/data/configdb
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            start_period: 10s
            retries: 12
        networks:
            acceptance:

    backend:
        image: exchange-core-backend:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./docker/exchange.service/Dockerfile
        ports:
            - "${BACKEND_ACCEPTANCE_PORT:-5000}:5000"
        environment:
            ASPNETCORE_ENVIRONMENT: Docker
        volumes:
            - backend_logs:/exchange/service/logs
            - backend_indicators:/exchange/service/indicators
        read_only: true
        tmpfs:
            - /tmp
        networks:
            acceptance:

    celery:
        image: exchange-core-machine-learning:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./docker/service.machine.learning/Dockerfile
        command:
            ["celery", "-A", "app.tasks.task_work:celery", "worker", "--loglevel=INFO", "--pool=prefork"]
        environment: *machine-learning-environment
        volumes:
            - ml_artifacts:/usr/src/app/static
        read_only: true
        tmpfs:
            - /tmp
        depends_on:
            mongodb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "healthcheck_worker.py"]
            interval: 10s
            timeout: 10s
            start_period: 30s
            retries: 6
        networks:
            acceptance:

    machinelearning:
        image: exchange-core-machine-learning:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./docker/service.machine.learning/Dockerfile
        command: ["python", "main.py"]
        ports:
            - "${ML_ACCEPTANCE_PORT:-5005}:5005"
        environment: *machine-learning-environment
        volumes:
            - ml_artifacts:/usr/src/app/static
        read_only: true
        tmpfs:
            - /tmp
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            acceptance:

    frontend:
        image: exchange-core-frontend:${EXCHANGE_CORE_IMAGE_TAG:-local}
        init: true
        build:
            context: ./exchange.signalR.client.web.frontend.angular
            dockerfile: Dockerfile
        ports:
            - "${FRONTEND_ACCEPTANCE_PORT:-9080}:8080"
        environment:
            EXCHANGE_HUB_URL: /backend/hubs/exchange
            ML_API_URL: /machinelearning/api/v1/
        read_only: true
        tmpfs:
            - /tmp
        depends_on:
            backend:
                condition: service_healthy
            machinelearning:
                condition: service_healthy
        networks:
            acceptance:

    gateway:
        image: nginx:1.30.4-alpine3.24-slim
        init: true
        restart: unless-stopped
        ports:
            - "${GATEWAY_ACCEPTANCE_PORT:-8088}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        read_only: true
        tmpfs:
            - /var/cache/nginx
            - /var/run
            - /tmp
        depends_on:
            backend:
                condition: service_healthy
            frontend:
                condition: service_healthy
            machinelearning:
                condition: service_healthy
        networks:
            acceptance:
